name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git history cho ngày tạo/sửa
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache npm
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - run: npm ci # plugin @quartz-community/* là npm package, cài ở bước này
      - run: npx quartz plugin install --from-config # liên kết plugin cục bộ ./plugins/atlas (lockfile chứa đường dẫn tuyệt đối nên không commit)
      - run: npx quartz build
      - name: Kiểm tra hiển thị (cuộn ngang, Mermaid) ở 390px và 1440px
        # Chrome có sẵn trên runner ubuntu; playwright-core cài --no-save để không đụng package.json của Quartz
        # PR: chỉ kiểm trang bị ảnh hưởng (scripts/changed-pages.mjs; đổi theme/cấu hình/script thì vẫn kiểm cả site).
        # Push lên main và chạy tay: kiểm cả site trước khi deploy.
        run: |
          npm install --no-save playwright-core@1.49.1
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/changed-pages.mjs HEAD^1 HEAD > "$RUNNER_TEMP/pages.txt"
            node scripts/check-render.mjs public --pages "$RUNNER_TEMP/pages.txt"
          else
            node scripts/check-render.mjs
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
