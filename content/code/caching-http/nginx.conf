# nginx đóng vai CDN / shared cache trước origin.
# Header X-Cache-Status cho biết cache làm gì với từng request: MISS, HIT, STALE, UPDATING, REVALIDATED, BYPASS…
events {}
http {
  proxy_cache_path /tmp/cache keys_zone=edge:10m max_size=100m inactive=10m;

  server {
    listen 80;
    location / {
      proxy_pass http://origin:3000;
      proxy_cache edge;
      proxy_cache_key $scheme$host$request_uri;   # khóa cache: URL (Vary thêm header vào sau)
      proxy_cache_revalidate on;                  # hết hạn thì hỏi lại origin bằng If-None-Match
      proxy_cache_background_update on;           # cập nhật bản mới ở nền khi đang trả bản cũ
      proxy_cache_lock on;                        # nhiều request cùng trượt: chỉ 1 request lên origin
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }
}
