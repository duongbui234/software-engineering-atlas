# Hai lỗ hổng do cache: web cache deception và cache poisoning (chạy trên máy mình, chỉ để học).
# Chạy: docker compose -p atlas-sec up -d && node attack.ts
# Dọn: docker compose -p atlas-sec down
services:
  origin:
    image: node:24-alpine
    command: node /app/origin.ts
    volumes: ["./origin.ts:/app/origin.ts:ro"]
  edge:
    image: nginx:1.27-alpine
    ports: ["8090:8090", "8091:8091"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [origin]
