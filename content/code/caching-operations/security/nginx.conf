# Hai cấu hình cache trên cùng origin:
#   cổng 8090: cấu hình "tiện tay" hay gặp: thấy đuôi .css/.js/.png là cache 10 phút, bỏ qua header của origin;
#              khóa cache chỉ có URL, nhưng header X-Forwarded-Host vẫn được chuyển cho origin.
#   cổng 8091: cấu hình đã sửa: tôn trọng Cache-Control của origin, không chuyển header lạ lên origin.
events {}
http {
  proxy_cache_path /tmp/c1 keys_zone=loose:10m;
  proxy_cache_path /tmp/c2 keys_zone=strict:10m;

  server {
    listen 8090;
    location ~* \.(css|js|png)$ {
      proxy_pass http://origin:3000;
      proxy_cache loose;
      proxy_cache_key $scheme$host$request_uri;
      proxy_ignore_headers Cache-Control Set-Cookie Expires;   # "file tĩnh thì cứ cache"
      proxy_cache_valid 200 10m;
      add_header X-Cache-Status $upstream_cache_status always;
    }
    location / {
      proxy_pass http://origin:3000;
      proxy_set_header X-Forwarded-Host $http_x_forwarded_host; # chuyển nguyên header của client
      proxy_cache loose;
      proxy_cache_key $scheme$host$request_uri;                  # ...nhưng không đưa nó vào khóa
      add_header X-Cache-Status $upstream_cache_status always;
    }
  }

  server {
    listen 8091;
    location / {
      proxy_pass http://origin:3000;
      proxy_set_header X-Forwarded-Host "";                     # header không thuộc khóa thì không cho tới origin
      proxy_cache strict;
      proxy_cache_key $scheme$host$request_uri;
      add_header X-Cache-Status $upstream_cache_status always;  # Cache-Control của origin được tôn trọng
    }
  }
}
